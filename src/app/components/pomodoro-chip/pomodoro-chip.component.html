@if (note(); as note) {
  <span class="visually-hidden" role="status">{{ note }}</span>
}
@if (visible()) {
  <span class="chip-anchor">
    <button
      #chip
      type="button"
      class="btn btn--secondary btn--sm chip"
      [class.chip--running]="clock.running()"
      [attr.data-mode]="clock.mode()"
      aria-haspopup="dialog"
      [attr.aria-expanded]="open()"
      [attr.aria-label]="texts().label"
      (click)="toggle()"
    >
      @if (clock.running()) {
        <span class="chip__dot" aria-hidden="true"></span>
      } @else {
        <span class="chip__pause" aria-hidden="true"></span>
      }
      @if (sportask.active()) {
        <svg class="chip__sport" viewBox="0 0 16 8" aria-hidden="true"><path d="M1 2v4M3.5 1v6M6 4h4M12.5 1v6M15 2v4" /></svg>
      }
      <span class="chip__time">{{ clock.formattedTime() }}</span>
      <span class="chip__extra" aria-hidden="true">{{ texts().extra }}</span>
    </button>
    @if (open()) {
      @defer (on immediate) {
        <app-pomodoro-popover (closed)="onClosed($event)" />
      }
    }
  </span>
}
