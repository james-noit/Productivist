<div class="effectivity">
  <div class="effectivity__body">
    <span class="effectivity__label">{{ 'multitask.effectivityTitle' | translate }}</span>
    <span class="effectivity__pct" [style.color]="colorVar()">{{
      percentage() === null ? '—' : percentage() + '%'
    }}</span>
    <span class="effectivity__counts">
      <span class="effectivity__count">
        <span class="effectivity__swatch effectivity__swatch--green" aria-hidden="true"></span>
        <span class="visually-hidden">{{ 'multitask.effectivityGreen' | translate }}</span>
        {{ multitask.greenBoxes() }}
      </span>
      <span class="effectivity__count">
        <span class="effectivity__swatch effectivity__swatch--red" aria-hidden="true"></span>
        <span class="visually-hidden">{{ 'multitask.effectivityRed' | translate }}</span>
        {{ multitask.redBoxes() }}
      </span>
    </span>
  </div>
  <button
    type="button"
    class="effectivity__restart"
    [attr.aria-label]="'multitask.restartCounter' | translate"
    [title]="'multitask.restartCounter' | translate"
    (click)="restart()"
  >
    <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
      <path
        fill="currentColor"
        d="M12 5V2L7 7l5 5V8c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"
      />
    </svg>
  </button>
  <div class="effectivity__popover" role="tooltip">
    {{ 'multitask.effectivityTooltip' | translate }}
  </div>
</div>
