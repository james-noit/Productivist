<div
  class="modal-overlay new-task__overlay"
  (click)="$event.target === $event.currentTarget && close.emit()"
  (keydown)="handleKeydown($event)"
  role="dialog"
  aria-modal="true"
>
  <form class="modal-panel new-task__modal" (submit)="$event.preventDefault(); handleSubmit()">
    <div class="new-task__header">
      <h3>{{ modalTitle }}</h3>
      <button type="button" class="new-task__close" aria-label="Close" (click)="close.emit()">✕</button>
    </div>

    <div class="new-task__priority">
      <span>{{ importanceLabel() }}</span>
      <span>·</span>
      <span>{{ urgencyLabel() }}</span>
    </div>

    <label class="new-task__field new-task__field--title">
      <input
        [ngModel]="title()"
        (ngModelChange)="title.set($event)"
        name="title"
        type="text"
        [placeholder]="'todo.addPlaceholder' | translate"
        autofocus
        required
      />
    </label>

    <label class="new-task__field">
      <textarea
        [ngModel]="description()"
        (ngModelChange)="description.set($event)"
        name="description"
        rows="2"
        [placeholder]="'todo.descriptionPlaceholder' | translate"
      ></textarea>
    </label>

    <label class="new-task__field new-task__field--pomodoros">
      {{ 'todo.pomodorosForTermination' | translate }}
      <input
        [ngModel]="pomodorosForTermination()"
        (ngModelChange)="pomodorosForTermination.set($event)"
        name="pomodorosForTermination"
        type="number"
        min="1"
        [placeholder]="'todo.pomodorosForTerminationPlaceholder' | translate"
      />
    </label>

    <app-project-milestone-picker
      class="new-task__picker"
      [(projectRef)]="projectRef"
      [(milestoneRef)]="milestoneRef"
      [showInlineCreateButtons]="false"
    />

    <div class="new-task__actions">
      <button type="button" (click)="close.emit()">{{ 'projects.cancel' | translate }}</button>
      <button type="submit" class="new-task__save">{{ 'eisenhower.createTask.save' | translate }}</button>
    </div>
  </form>
</div>
