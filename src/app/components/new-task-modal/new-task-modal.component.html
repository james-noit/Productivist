<div
  class="modal-overlay new-task__overlay"
  (click)="closeOnBackdrop($event)"
  (keydown)="handleKeydown($event)"
  role="dialog"
  aria-modal="true"
>
  <form class="modal-panel new-task__modal" (submit)="$event.preventDefault(); handleSubmit()">
    <div class="new-task__header">
      <h3>{{ modalTitle }}</h3>
      <button type="button" class="btn btn--ghost btn--icon btn--sm" [attr.aria-label]="'todo.close' | translate" (click)="close.emit()">
        <app-ui-icon name="x" />
      </button>
    </div>

    @if (quadrant()) {
      <div class="new-task__priority">
        <span>{{ importanceLabel() }}</span>
        <span>·</span>
        <span>{{ urgencyLabel() }}</span>
      </div>
    }

    <label class="field new-task__field--title">
      <input
        #titleInput
        class="input"
        [ngModel]="title()"
        (ngModelChange)="title.set($event)"
        name="title"
        type="text"
        [placeholder]="'todo.addPlaceholder' | translate"
        required
      />
    </label>

    <label class="field">
      <textarea
        class="textarea"
        [ngModel]="description()"
        (ngModelChange)="description.set($event)"
        name="description"
        rows="2"
        [placeholder]="'todo.descriptionPlaceholder' | translate"
      ></textarea>
    </label>

    <label class="field">
      <span class="field__label">{{ 'todo.pomodorosForTermination' | translate }}</span>
      <input
        class="input"
        [ngModel]="pomodorosForTermination()"
        (ngModelChange)="pomodorosForTermination.set($event)"
        name="pomodorosForTermination"
        type="number"
        min="1"
        [placeholder]="'todo.pomodorosForTerminationPlaceholder' | translate"
      />
    </label>

    <app-project-milestone-picker
      [(projectRef)]="projectRef"
      [(milestoneRef)]="milestoneRef"
      [showInlineCreateButtons]="false"
    />

    @if (!quadrant()) {
      <div class="new-task__levels">
        <div class="field">
          <span class="field__label" id="new-task-importance">{{ 'todo.importance' | translate }}</span>
          <div class="segmented" role="group" aria-labelledby="new-task-importance">
            @for (level of priorities; track level) {
              <button type="button" class="segmented__option" [attr.aria-pressed]="importance() === level" (click)="importance.set(level)">
                {{ 'todo.' + level | translate }}
              </button>
            }
          </div>
        </div>
        <div class="field">
          <span class="field__label" id="new-task-urgency">{{ 'todo.urgency' | translate }}</span>
          <div class="segmented" role="group" aria-labelledby="new-task-urgency">
            @for (level of priorities; track level) {
              <button type="button" class="segmented__option" [attr.aria-pressed]="urgency() === level" (click)="urgency.set(level)">
                {{ 'todo.' + level | translate }}
              </button>
            }
          </div>
        </div>
      </div>
    }

    <div class="new-task__actions">
      <button type="button" class="btn btn--secondary" (click)="close.emit()">{{ 'projects.cancel' | translate }}</button>
      <button type="submit" class="btn btn--primary">{{ 'eisenhower.createTask.save' | translate }}</button>
    </div>
  </form>
</div>
