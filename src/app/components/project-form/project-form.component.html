<form class="project-form" (submit)="$event.preventDefault(); submit()">
  <div class="field">
    <span class="field__label">{{ 'projects.icon' | translate }}</span>
    <div class="project-form__icons">
      @for (option of icons; track option) {
        <button
          type="button"
          class="project-form__icon"
          [class.project-form__icon--selected]="icon() === option"
          [attr.aria-label]="option"
          [attr.aria-pressed]="icon() === option"
          (click)="icon.set(option)"
        >
          <app-icon [name]="option" />
        </button>
      }
    </div>
  </div>
  <label class="field">
    <span class="field__label">{{ 'projects.name' | translate }}</span>
    <input
      class="input"
      [ngModel]="name()"
      (ngModelChange)="name.set($event)"
      name="name"
      type="text"
      [placeholder]="'projects.namePlaceholder' | translate"
      required
    />
  </label>
  <label class="field">
    <span class="field__label">{{ 'projects.description' | translate }}</span>
    <input
      class="input"
      [ngModel]="description()"
      (ngModelChange)="description.set($event)"
      name="description"
      type="text"
      [placeholder]="'projects.descriptionPlaceholder' | translate"
    />
  </label>
  <label class="field">
    <span class="field__label">{{ 'projects.notes' | translate }}</span>
    <textarea
      class="textarea"
      [ngModel]="notes()"
      (ngModelChange)="notes.set($event)"
      name="notes"
      rows="3"
      [placeholder]="'projects.notesPlaceholder' | translate"
    ></textarea>
  </label>
  <div class="project-form__actions">
    <button type="button" class="btn btn--secondary" (click)="cancel.emit()">
      {{ 'projects.cancel' | translate }}
    </button>
    <button type="submit" class="btn btn--primary" [disabled]="!name().trim()">{{ 'projects.save' | translate }}</button>
  </div>
</form>
