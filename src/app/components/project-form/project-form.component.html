<form class="project-form" (submit)="$event.preventDefault(); submit()">
  <div class="field">
    <span class="field__label" id="project-icon-label">{{ 'projects.icon' | translate }}</span>
    <input
      class="input project-form__icon-search"
      type="search"
      name="iconSearch"
      autocomplete="off"
      (keydown.enter)="$event.preventDefault()"
      [ngModel]="query()"
      (ngModelChange)="query.set($event)"
      [attr.aria-label]="'projects.searchIcons' | translate"
      [placeholder]="'projects.searchIcons' | translate"
    />
    <div
      #grid
      class="project-form__icons"
      role="group"
      aria-labelledby="project-icon-label"
      (keydown)="moveFocus($event)"
    >
      @for (section of sections(); track section.key) {
        <div class="project-form__group-title">{{ section.title }}</div>
        <div class="project-form__group">
          @for (option of section.icons; track option.name) {
            <button
              type="button"
              class="project-form__icon"
              [class.project-form__icon--selected]="icon() === option.name"
              [attr.aria-label]="option.label"
              [attr.aria-pressed]="icon() === option.name"
              [attr.tabindex]="tabStop() === option.name ? 0 : -1"
              [title]="option.label"
              (focus)="focused.set(option.name)"
              (click)="icon.set(option.name)"
            >
              <app-icon [name]="option.name" />
            </button>
          }
        </div>
      } @empty {
        <p class="project-form__no-icons">{{ 'projects.noIcons' | translate }}</p>
      }
    </div>
  </div>
  <label class="field">
    <span class="field__label">{{ 'projects.name' | translate }}</span>
    <input
      class="input"
      [ngModel]="name()"
      (ngModelChange)="name.set($event)"
      name="name"
      type="text"
      [placeholder]="'projects.namePlaceholder' | translate"
      required
    />
  </label>
  <label class="field">
    <span class="field__label">{{ 'projects.description' | translate }}</span>
    <input
      class="input"
      [ngModel]="description()"
      (ngModelChange)="description.set($event)"
      name="description"
      type="text"
      [placeholder]="'projects.descriptionPlaceholder' | translate"
    />
  </label>
  <label class="field">
    <span class="field__label">{{ 'projects.notes' | translate }}</span>
    <textarea
      class="textarea"
      [ngModel]="notes()"
      (ngModelChange)="notes.set($event)"
      name="notes"
      rows="3"
      [placeholder]="'projects.notesPlaceholder' | translate"
    ></textarea>
  </label>
  <div class="project-form__actions">
    <button type="button" class="btn btn--secondary" (click)="cancel.emit()">
      {{ 'projects.cancel' | translate }}
    </button>
    <button type="submit" class="btn btn--primary" [disabled]="!name().trim()">{{ 'projects.save' | translate }}</button>
  </div>
</form>
