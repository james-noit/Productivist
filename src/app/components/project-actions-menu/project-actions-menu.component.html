@let p = project();
<app-kebab-menu #menu="kebabMenu" [label]="'projects.card.menu' | translate: { name: p.name }" (closed)="resetMenu()">
  @if (addingMilestone()) {
    <app-milestone-quick-form (submitted)="submitMilestone($event, menu)" />
  } @else if (confirming()) {
    <p class="confirm-text">{{ 'projects.card.deleteQuestion' | translate }}</p>
    <button type="button" role="menuitem" class="menu-item" (click)="confirming.set(false); menu.focusFirst()">
      {{ 'projects.card.keep' | translate }}
    </button>
    <button type="button" role="menuitem" class="menu-item menu-item--danger" (click)="menu.close(); deleteProject()">
      <app-ui-icon name="trash" [size]="16" /> {{ 'projects.card.deleteProject' | translate }}
    </button>
  } @else {
    <button type="button" role="menuitem" class="menu-item" (click)="menu.close(); open()">
      <app-ui-icon name="open" [size]="16" /> {{ 'projects.card.open' | translate }}
    </button>
    <button type="button" role="menuitem" class="menu-item" (click)="menu.close(); edit.emit()">
      <app-ui-icon name="edit" [size]="16" /> {{ 'projects.edit' | translate }}
    </button>
    <button type="button" role="menuitem" class="menu-item" (click)="startMilestone()">
      <app-ui-icon name="plus" [size]="16" /> {{ 'projects.card.newMilestone' | translate }}
    </button>
    <button type="button" role="menuitem" class="menu-item menu-item--danger" (click)="askDelete(menu)">
      <app-ui-icon name="trash" [size]="16" /> {{ 'projects.delete' | translate }}
    </button>
  }
</app-kebab-menu>
