<div class="task-drawer">
  <button
    type="button"
    class="task-drawer__trigger"
    aria-haspopup="dialog"
    [attr.aria-expanded]="open()"
    (click)="toggle()"
  >
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
      <path fill="currentColor" d="M4 4h16v2H4zm0 7h16v2H4zm0 7h10v2H4z" />
    </svg>
    <span>{{ 'multitask.manageTasks' | translate }}</span>
    @if (todos.todos().length) {
      <span class="task-drawer__badge">{{ todos.filteredTodos().length }}</span>
    }
  </button>

  @if (open()) {
    <div class="task-drawer__overlay" (click)="close()"></div>
    <aside class="task-drawer__panel" role="dialog" [attr.aria-label]="'multitask.manageTasks' | translate">
      <div class="task-drawer__header">
        <h3>{{ 'multitask.manageTasks' | translate }}</h3>
        <button type="button" class="task-drawer__close" [attr.aria-label]="'todo.close' | translate" (click)="close()">✕</button>
      </div>

      <div class="task-drawer__tabs" role="tablist">
        <button
          type="button"
          role="tab"
          [attr.aria-selected]="todos.viewMode() === 'all'"
          [class.active]="todos.viewMode() === 'all'"
          (click)="todos.setViewMode('all')"
        >
          {{ 'todo.viewAll' | translate }}
        </button>
        <button
          type="button"
          role="tab"
          [attr.aria-selected]="todos.viewMode() === 'projects'"
          [class.active]="todos.viewMode() === 'projects'"
          (click)="todos.setViewMode('projects')"
        >
          {{ 'todo.viewProjects' | translate }}
        </button>
      </div>

      @if (todos.viewMode() === 'all') {
        <app-todo-form />

        @if (todos.todos().length) {
          <div class="task-drawer__toolbar">
            <app-todo-filters />
            @if (todos.completedTodos().length) {
              <app-completed-tasks-stack />
            }
          </div>
        }

        <div class="task-drawer__heading-row">
          <h4 class="task-drawer__heading">{{ 'multitask.taskPool' | translate }}</h4>
          <span class="task-drawer__count">{{ todos.filteredTodos().length }}</span>
        </div>

        <app-task-pool-list
          [tasks]="todos.filteredTodos()"
          [isPickable]="isPickable"
          [hideUnpickable]="false"
          [unpickableStatus]="'multitask.inGrid' | translate"
          (pick)="assignToNewCard($event)"
        />
      } @else {
        <app-projects-panel [multitaskMode]="true" />
      }
    </aside>
  }
</div>
