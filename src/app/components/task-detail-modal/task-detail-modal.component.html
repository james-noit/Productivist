<div class="modal-overlay task-detail__overlay" (click)="$event.target === $event.currentTarget && close.emit()">
  <div class="modal-panel task-detail__modal" role="dialog" aria-modal="true" [attr.aria-label]="'eisenhower.taskDetail' | translate">
    <div class="task-detail__header">
      <h3>{{ 'eisenhower.taskDetail' | translate }}</h3>
      <button type="button" class="task-detail__close" [attr.aria-label]="'todo.close' | translate" (click)="close.emit()">✕</button>
    </div>

    <label class="task-detail__done">
      <input type="checkbox" [checked]="todo().done" (change)="todos.toggleDone(todo().id)" />
      {{ 'eisenhower.markDone' | translate }}
    </label>

    <input
      [ngModel]="title()"
      (ngModelChange)="title.set($event)"
      name="title"
      type="text"
      class="task-detail__title"
      (change)="commitTitle()"
    />

    <label class="task-detail__description-label">
      {{ 'todo.description' | translate }}
      <textarea
        [ngModel]="description()"
        (ngModelChange)="description.set($event)"
        name="description"
        rows="2"
        [placeholder]="'todo.descriptionPlaceholder' | translate"
        (change)="commitDescription()"
      ></textarea>
    </label>

    <app-project-milestone-picker
      [(projectRef)]="projectRef"
      [(milestoneRef)]="milestoneRef"
      (projectPicked)="onProjectSelect()"
      (milestonePicked)="onMilestoneSelect()"
      (createProject)="submitNewProject($event)"
      (createMilestone)="submitNewMilestone($event)"
    />

    <div class="task-detail__row">
      <label>
        {{ 'todo.importance' | translate }}
        <select [ngModel]="importance()" (ngModelChange)="importance.set($event)" name="importance" (change)="commitImportance()">
          <option value="low">{{ 'todo.low' | translate }}</option>
          <option value="medium">{{ 'todo.medium' | translate }}</option>
          <option value="high">{{ 'todo.high' | translate }}</option>
        </select>
      </label>
      <label>
        {{ 'todo.urgency' | translate }}
        <select [ngModel]="urgency()" (ngModelChange)="urgency.set($event)" name="urgency" (change)="commitUrgency()">
          <option value="low">{{ 'todo.low' | translate }}</option>
          <option value="medium">{{ 'todo.medium' | translate }}</option>
          <option value="high">{{ 'todo.high' | translate }}</option>
        </select>
      </label>
    </div>

    <label class="task-detail__tags-label">
      {{ 'todo.tags' | translate }}
      <input
        [ngModel]="tagsInput()"
        (ngModelChange)="tagsInput.set($event)"
        name="tagsInput"
        type="text"
        [placeholder]="'todo.tagsPlaceholder' | translate"
        (change)="commitTags()"
      />
    </label>

    <label class="task-detail__tags-label">
      {{ 'todo.pomodorosForTermination' | translate }}
      <input
        [ngModel]="pomodorosForTermination()"
        (ngModelChange)="pomodorosForTermination.set($event)"
        name="pomodorosForTermination"
        type="number"
        min="1"
        [placeholder]="'todo.pomodorosForTerminationPlaceholder' | translate"
        (change)="commitPomodorosForTermination()"
      />
    </label>

    <button type="button" class="task-detail__delete" (click)="remove()">{{ 'todo.delete' | translate }}</button>
  </div>
</div>
