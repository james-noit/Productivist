<div class="todo-filters">
  <button
    type="button"
    class="todo-filters__trigger"
    aria-haspopup="true"
    [attr.aria-expanded]="open()"
    (click)="toggle()"
  >
    <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
      <path fill="currentColor" d="M3 5h18v2l-7 7v6l-4-2v-4L3 7z" />
    </svg>
    <span>{{ 'todo.filterToDos' | translate }}</span>
  </button>
  @if (open()) {
    <div class="todo-filters__overlay" (click)="close()"></div>
    <div class="todo-filters__panel" role="dialog" [attr.aria-label]="filterLabel">
      <label>
        {{ 'todo.importance' | translate }}
        <select [value]="todos.filters().importance" (change)="onImportance($event)">
          <option value="all">{{ 'todo.filterAll' | translate }}</option>
          <option value="low">{{ 'todo.low' | translate }}</option>
          <option value="medium">{{ 'todo.medium' | translate }}</option>
          <option value="high">{{ 'todo.high' | translate }}</option>
        </select>
      </label>
      <label>
        {{ 'todo.urgency' | translate }}
        <select [value]="todos.filters().urgency" (change)="onUrgency($event)">
          <option value="all">{{ 'todo.filterAll' | translate }}</option>
          <option value="low">{{ 'todo.low' | translate }}</option>
          <option value="medium">{{ 'todo.medium' | translate }}</option>
          <option value="high">{{ 'todo.high' | translate }}</option>
        </select>
      </label>
      <label>
        {{ 'todo.tags' | translate }}
        <select [value]="todos.filters().tag" (change)="onTag($event)">
          <option value="all">{{ 'todo.filterAll' | translate }}</option>
          @for (tag of todos.allTags(); track tag) {
            <option [value]="tag">{{ tag }}</option>
          }
        </select>
      </label>
    </div>
  }
</div>
