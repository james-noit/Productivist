<div class="ss__skins" role="radiogroup" [attr.aria-label]="'sportask.style.list' | translate">
  @for (s of skinTiles(); track s.id) {
    <button type="button" role="radio" class="ss__skin" [attr.aria-checked]="value().skin === s.id" [class.ss__skin--on]="value().skin === s.id" (click)="setSkin(s.id)">
      <span class="ss__swatch" aria-hidden="true" [style.background-color]="s.preview[0]">
        <span class="ss__swatch-bar" [style.background-color]="s.preview[1]"></span>
        <span class="ss__swatch-dot" [style.background-color]="s.preview[2]"></span>
      </span>
      <span class="ss__skin-name">{{ s.name }}</span>
      <span class="ss__row-sub">{{ (s.scheme === 'dark' ? 'sportask.style.dark' : 'sportask.style.light') | translate }}</span>
    </button>
  }
</div>
<button type="button" role="switch" class="switch" [attr.aria-checked]="value().skinWholeApp" (click)="toggle('skinWholeApp')">
  <span class="switch__track"></span>
  <span>{{ 'sportask.style.wholeApp' | translate }}</span>
</button>
<button type="button" role="switch" class="switch" [attr.aria-checked]="value().cues" (click)="toggle('cues')">
  <span class="switch__track"></span>
  <span>{{ 'sportask.style.cues' | translate }}</span>
</button>
<button type="button" role="switch" class="switch" [attr.aria-checked]="value().autoStartBreak" (click)="toggle('autoStartBreak')">
  <span class="switch__track"></span>
  <span>{{ 'sportask.style.autoStart' | translate }}</span>
</button>
