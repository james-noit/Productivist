<main class="projects-view">
  <div class="projects-view__header">
    <h2>{{ 'projects.title' | translate }}</h2>
    <div class="projects-view__tabs" role="tablist" (keydown)="onTabKeydown($event)">
      <button
        type="button"
        role="tab"
        data-tab="projects"
        [attr.aria-selected]="view.projectsTab() === 'projects'"
        [attr.tabindex]="view.projectsTab() === 'projects' ? 0 : -1"
        [class.active]="view.projectsTab() === 'projects'"
        (click)="selectTab('projects')"
      >
        {{ 'projects.tabProjects' | translate }}
      </button>
      <button
        type="button"
        role="tab"
        data-tab="matrix"
        [attr.aria-selected]="view.projectsTab() === 'matrix'"
        [attr.tabindex]="view.projectsTab() === 'matrix' ? 0 : -1"
        [class.active]="view.projectsTab() === 'matrix'"
        (click)="selectTab('matrix')"
      >
        {{ 'projects.tabMatrix' | translate }}
      </button>
    </div>
    <button type="button" class="projects-view__plan" (click)="view.openPlanning()">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
        <path
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M9 2h6M10 2v6.2L4.7 17a2 2 0 0 0 1.7 3h11.2a2 2 0 0 0 1.7-3L14 8.2V2"
        />
        <path fill="currentColor" opacity="0.55" d="M6.9 15h10.2l1.6 2.7a1 1 0 0 1-.86 1.3H6.16a1 1 0 0 1-.86-1.3z" />
        <circle cx="10" cy="12.5" r="0.8" fill="currentColor" />
        <circle cx="13.5" cy="14" r="0.6" fill="currentColor" />
      </svg>
      @if (planInProgress()) {
        {{ 'planningLab.resumeButton' | translate: { step: planStep() } }}
      } @else {
        {{ 'planningLab.openButton' | translate }}
      }
    </button>
  </div>

  @if (view.projectsTab() === 'matrix') {
    @defer (on immediate) {
      <app-eisenhower-view />
    } @placeholder {
      <div class="view-loading" aria-hidden="true"></div>
    }
  } @else {
    <app-projects-panel [withBacklog]="true" />
  }
</main>
