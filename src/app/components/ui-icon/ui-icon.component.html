<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 24 24"
  [attr.width]="size()"
  [attr.height]="size()"
  fill="none"
  stroke="currentColor"
  stroke-width="1.75"
  stroke-linecap="round"
  stroke-linejoin="round"
  aria-hidden="true"
  focusable="false"
>
  @switch (name()) {
    @case ('x') {
      <path d="M6 6l12 12M18 6L6 18" />
    }
    @case ('trash') {
      <path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4.5A1.5 1.5 0 0 1 10.5 3h3A1.5 1.5 0 0 1 15 4.5V7" />
    }
    @case ('repeat') {
      <path d="M17 2.5l3 3-3 3M4 11V10a3 3 0 0 1 3-3h13M7 21.5l-3-3 3-3M20 13v1a3 3 0 0 1-3 3H4" />
    }
    @case ('calendar') {
      <rect x="4" y="5" width="16" height="16" rx="2" />
      <path d="M4 10h16M8 3v4M16 3v4" />
    }
    @case ('plus') {
      <path d="M12 5v14M5 12h14" />
    }
    @case ('minus') {
      <path d="M5 12h14" />
    }
    @case ('more') {
      <circle cx="5.5" cy="12" r="1" />
      <circle cx="12" cy="12" r="1" />
      <circle cx="18.5" cy="12" r="1" />
    }
    @case ('check') {
      <path d="M5 12.5l4.5 4.5L19 7.5" />
    }
    @case ('search') {
      <circle cx="11" cy="11" r="6.5" />
      <path d="M16 16l4.5 4.5" />
    }
    @case ('chevron-down') {
      <path d="M6 9l6 6 6-6" />
    }
    @case ('chevron-right') {
      <path d="M9 6l6 6-6 6" />
    }
    @case ('edit') {
      <path d="M4 20l1-4L16.5 4.5a2.1 2.1 0 0 1 3 3L8 19zM14.5 6.5l3 3" />
    }
    @case ('pause') {
      <path d="M8.5 5v14M15.5 5v14" />
    }
    @case ('play') {
      <path d="M7 5l12 7-12 7z" />
    }
    @case ('flag') {
      <path d="M5 21V4M5 4h11l-2 4 2 4H5" />
    }
    @case ('clock') {
      <circle cx="12" cy="12" r="9" />
      <path d="M12 7v5l3 2" />
    }
    @case ('inbox') {
      <path d="M3 13l3-8h12l3 8M3 13v6h18v-6M3 13h5l1 3h6l1-3h5" />
    }
    @case ('open') {
      <path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5" />
    }
    @case ('grip') {
      <circle cx="9" cy="6" r="1" />
      <circle cx="15" cy="6" r="1" />
      <circle cx="9" cy="12" r="1" />
      <circle cx="15" cy="12" r="1" />
      <circle cx="9" cy="18" r="1" />
      <circle cx="15" cy="18" r="1" />
    }
    @case ('alert') {
      <path d="M12 4L2.5 20h19zM12 10v4M12 17.2v.01" />
    }
    @case ('filter') {
      <path d="M4 5.5h16l-6 7.2V19l-4 1.8v-8.1z" />
    }
    @case ('grid') {
      <rect x="4" y="4" width="6.5" height="6.5" rx="1.3" />
      <rect x="13.5" y="4" width="6.5" height="6.5" rx="1.3" />
      <rect x="4" y="13.5" width="6.5" height="6.5" rx="1.3" />
      <rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.3" />
    }
    @case ('list') {
      <path d="M9.5 6.5H20M9.5 12H20M9.5 17.5H20" />
      <circle cx="4.8" cy="6.5" r="0.9" />
      <circle cx="4.8" cy="12" r="0.9" />
      <circle cx="4.8" cy="17.5" r="0.9" />
    }
    @case ('folder') {
      <path d="M3 7a2 2 0 0 1 2-2h4l2.2 2.5H19a2 2 0 0 1 2 2V17a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
    }
  }
</svg>
