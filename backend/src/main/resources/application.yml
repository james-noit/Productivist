spring:
  autoconfigure:
    # Auth is bearer-token only; do not generate a default in-memory user.
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  application:
    name: productivist-backend
  datasource:
    # Railway's Postgres plugin exposes PGHOST/PGPORT/PGDATABASE/PGUSER/PGPASSWORD
    # (DATABASE_URL is not a JDBC URL, so it is not used here).
    url: jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:productivist}
    username: ${PGUSER:productivist}
    password: ${PGPASSWORD:productivist}
  servlet:
    multipart:
      enabled: false

server:
  port: ${PORT:8080}
  tomcat:
    max-http-form-post-size: 1MB
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  admin:
    # The one account allowed into /api/admin/**. Blank disables the admin API. Register this account yourself
    # before setting it: signup is open, so whoever registers the address first owns it.
    email: ${ADMIN_EMAIL:}
  fitness:
    # Comma-separated emails of the accounts that may author the Sportask catalog (/api/fitness/**). Blank = only the admin.
    # Register these accounts yourself first: signup is open, so whoever registers an address first owns it.
    director-emails: ${FITNESS_DIRECTOR_EMAILS:}
  cors:
    # moz-extension origins are random per Thunderbird profile, hence the wildcard. https://localhost is the
    # Android app's WebView and capacitor://localhost the iOS one (Capacitor, see docs/mobile/).
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,moz-extension://*,https://localhost,capacitor://localhost}
  sync:
    max-batch-size: 5000
  forge-relay:
    # DEVELOPMENT ONLY, never in production: lets the relay use http and loopback/private addresses (to try it against a
    # forge on localhost). Off unless this variable is set; the relay's address and scheme rules are its SSRF protection.
    unsafe-dev-allow-http-and-private-addresses: ${FORGE_RELAY_UNSAFE_DEV_ALLOW_HTTP_AND_PRIVATE:false}
